name: ludens-dev

services:
  postgres:
    image: postgres:16
    container_name: ludens-postgres-dev
    environment:
      POSTGRES_USER: ludens
      POSTGRES_PASSWORD: ludens
      POSTGRES_DB: ludens
    ports:
      - "5432:5432"
    volumes:
      - ludens-pg-data:/var/lib/postgresql/data
    networks:
      - ludens-dev

volumes:
  ludens-pg-data:

networks:
  ludens-dev:
    name: ludens-dev
