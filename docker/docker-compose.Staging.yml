name: ludens-staging

services:
  postgres:
    image: postgres:16
    container_name: ludens-postgres-staging
    environment:
      POSTGRES_USER: ludens
      POSTGRES_PASSWORD: ludens
      POSTGRES_DB: ludens_test
    ports:
      - "5433:5432"
    volumes:
      - ludens-pg-staging-data:/var/lib/postgresql/data
    networks:
      - ludens-staging

volumes:
  ludens-pg-staging-data:

networks:
  ludens-staging:
    name: ludens-staging
