name: Deploy

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Run terraform apply (default: plan only, no infra change)'
        required: false
        type: boolean
        default: false

# `_publish.yaml` needs `packages: write` to push to GHCR — a called reusable
# workflow can never get more than the caller grants, so this must be
# declared here explicitly rather than relying on the org/repo default.
permissions:
  contents: read
  packages: write

jobs:
  # GHCR packages can be created private even in a public repo. After the
  # first real run of this job, confirm/flip ghcr.io/gcarvalhow/api.ludens
  # to public (terraform/README.md already flags this as this issue's job) —
  # app_service has no registry credentials configured, so a private
  # package breaks the App Service's docker pull on startup.
  publish:
    uses: gcarvalhow/pipelines.ludens/.github/workflows/_publish.yaml@master
    with:
      image-name: ghcr.io/gcarvalhow/api.ludens
    secrets: inherit

  terraform:
    needs: publish
    uses: gcarvalhow/pipelines.ludens/.github/workflows/_terraform.yaml@master
    with:
      working-directory: terraform
      apply: ${{ inputs.apply }}
      # Ties docker_image_name to this commit's sha so Terraform actually
      # detects a diff and updates the App Service — the default in
      # modules/app_service/variables.tf never changes on its own, so
      # without this every apply after the first would be a no-op and the
      # container would keep running the old image.
      tf-vars: |
        TF_VAR_docker_image_name=ghcr.io/gcarvalhow/api.ludens:${{ github.sha }}
    secrets: inherit
