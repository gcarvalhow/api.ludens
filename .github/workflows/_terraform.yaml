name: _Template Terraform

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Directory containing the Terraform root module'
        required: false
        type: string
        default: '.'
      apply:
        description: 'Run terraform apply after a clean plan (default: plan only, no infra change)'
        required: false
        type: boolean
        default: false
      tf-vars:
        description: 'Extra TF_VAR_* environment variables to export before plan/apply, one KEY=VALUE per line'
        required: false
        type: string
        default: ''
      backend-config:
        description: 'Azure backend configuration, one key=value per line'
        required: true
        type: string
    secrets:
      ARM_CLIENT_ID:
        required: true
      ARM_CLIENT_SECRET:
        required: true
      ARM_SUBSCRIPTION_ID:
        required: true
      ARM_TENANT_ID:
        required: true

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set extra TF_VAR_* variables
        if: inputs.tf-vars != ''
        env:
          TF_VARIABLES: ${{ inputs.tf-vars }}
        run: printf '%s\n' "$TF_VARIABLES" >> "$GITHUB_ENV"

      - name: Configure remote state
        env:
          BACKEND_CONFIG: ${{ inputs.backend-config }}
        run: |
          test -n "$BACKEND_CONFIG" || { echo 'Terraform backend configuration is required'; exit 1; }
          printf '%s\n' "$BACKEND_CONFIG" > backend.hcl

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        if: inputs.apply
        run: terraform apply -auto-approve tfplan
