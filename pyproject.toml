[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-ludens"
version = "0.1.0"
description = "Backend FastAPI da plataforma Ludens (venda de ingressos de teatro comunitário)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
    "azure-communication-email>=1.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]   # src/migrations não é pacote Python

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
# Fixtures async (ex. `engine` em tests/conftest.py) são session-scoped — asyncpg
# não aceita reusar uma conexão criada num event loop diferente do da fixture,
# então o loop também precisa ser session-scoped (senão cada teste ganha um loop
# novo e a conexão da fixture quebra com "another operation is in progress").
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: exercita usecases/repositórios contra um Postgres real (docker/docker-compose.Staging.yml).",
]
