[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-ludens"
version = "0.1.0"
description = "Backend FastAPI da plataforma Ludens (venda de ingressos de teatro comunitário)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "aiosmtplib>=3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# UP (pyupgrade) fica de fora por ora: a base copiada de api.hub.dommed usa
# typing.Callable/Sequence etc. Reavaliar quando a base estiver estabilizada.
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Base portada de api.hub.dommed, quase verbatim (o repo de origem não tinha
# linter). Mantida como está para facilitar futuros merges da base; código NOVO
# de módulo segue a regra estrita. Reavaliar depois de a base estabilizar.
"src/app/core/**" = ["I001", "E501"]
"src/app/outbox/models.py" = ["I001"]
"src/app/core/**/__init__.py" = ["F401"]
"migrations/env.py" = ["I001", "E402"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
